name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The toolchain named by go.mod's `go` line is pinned, not auto-upgraded.
  GOTOOLCHAIN: local

jobs:
  cli-required:
    name: CLI required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt found unformatted files (run: gofmt -w .)"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: go tool golangci-lint run

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: cross-build six platforms (goreleaser snapshot)
        run: go tool goreleaser build --snapshot --clean

      - name: govulncheck
        run: go tool govulncheck ./...

      - name: go mod tidy (no diff)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Dogfooding (phase 14): the freshly built binary runs its own
      # `standards check .` against this repository and its embedded
      # reference pack (plus this repo's own .ai-flow/standards/
      # override — see that directory's own standards.json for why).
      # `golangci-lint`/`gitleaks` are check-runner tools this job
      # otherwise has no reason to install as their own binaries — the
      # step above already covers linting via `go tool golangci-lint`,
      # which is a different invocation from the bare `golangci-lint`
      # `standards check` shells out to — so both are provisioned here,
      # not assumed present. `conftest` (phase 25) is pinned to the
      # exact version this phase's own implementation verified by hand
      # (`conftest verify` and `conftest test --output json` against a
      # throwaway .tf/.yaml fixture, confirming both the reference
      # pack's own rego rules fire and internal/standards/check's
      # conftestFileResult Go type matches conftest's real --output
      # json shape byte for byte — see
      # .ai/phase-25/implementation-log.md).
      - name: install check-runner tools (gitleaks, golangci-lint shim, conftest)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          go install github.com/open-policy-agent/conftest@v0.70.1
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec go tool golangci-lint "$@"\n' > "$HOME/.local/bin/golangci-lint"
          chmod +x "$HOME/.local/bin/golangci-lint"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Phase 25/26: the reference pack's own rego tests
      # (packs/reference/infra/{terraform,kubernetes,helm}/checks/policy/*_test.rego)
      # against the real conftest binary just installed above.
      - name: conftest verify (reference pack rego)
        run: |
          conftest verify --policy packs/reference/infra/terraform/checks/policy
          conftest verify --policy packs/reference/infra/kubernetes/checks/policy
          conftest verify --policy packs/reference/infra/helm/checks/policy

      - name: build ai-flow
        run: go build -o /tmp/ai-flow-dogfood ./cmd/ai-flow

      - name: standards validate packs/reference
        run: /tmp/ai-flow-dogfood standards validate packs/reference

      - name: standards check . (dogfood the reference pack)
        run: |
          AI_FLOW_HOME="$(mktemp -d)"
          /tmp/ai-flow-dogfood config init --home "$AI_FLOW_HOME"
          /tmp/ai-flow-dogfood standards check . --home "$AI_FLOW_HOME"
