name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # The toolchain named by go.mod's `go` line is pinned, not auto-upgraded.
  GOTOOLCHAIN: local

# Least privilege: every job here only reads the repository. A job that
# ever needs more gets its own job-level grant, never a wider default.
permissions:
  contents: read

jobs:
  cli-required:
    name: CLI required
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt found unformatted files (run: gofmt -w .)"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: go tool golangci-lint run

      # Check-runner tools, installed before `go test` so the README's own
      # CI command runs end to end against a real conftest
      # (TestStandardsCheckReadmeCommandEndToEnd), and reused by the
      # dogfood steps below. `golangci-lint`/`gitleaks` are tools this
      # job otherwise has no reason to install as their own binaries —
      # the lint step covers linting via `go tool golangci-lint`, a
      # different invocation from the bare `golangci-lint` `standards
      # check` shells out to — so a shim provides it. `conftest` is
      # pinned to the version phase 25 verified by hand (`conftest
      # verify` and `conftest test --output json` against the reference
      # pack's rego — see .ai/phase-25/implementation-log.md).
      - name: install check-runner tools (gitleaks, golangci-lint shim, conftest)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          go install github.com/open-policy-agent/conftest@v0.70.1
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec go tool golangci-lint "$@"\n' > "$HOME/.local/bin/golangci-lint"
          chmod +x "$HOME/.local/bin/golangci-lint"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # AI_FLOW_E2E_REQUIRE_TOOLS turns the end-to-end tests' "conftest /
      # gitleaks not on PATH" skips into failures here. -coverpkg=./...
      # credits a package with the coverage its callers' tests give it
      # (a per-package figure without it misreads, e.g. internal/agenthost);
      # the suite runs once, with instrumentation. The profile is written
      # outside the checkout so the dogfood steps below never scan it.
      - name: go test -race
        env:
          AI_FLOW_E2E_REQUIRE_TOOLS: "1"
        run: go test -race -count=1 -coverpkg=./... -coverprofile="$RUNNER_TEMP/coverage.out" ./...

      # A report, not a gate (phase 48, HYG-4): the total goes to the job
      # summary and the profile is kept for a week. Nothing compares
      # per-package numbers.
      - name: coverage report
        run: |
          total="$(go tool cover -func="$RUNNER_TEMP/coverage.out" | awk '/^total:/ {print $NF}')"
          echo "Statement coverage (-coverpkg=./...): ${total}"
          echo "### Coverage: ${total} of statements (-coverpkg=./..., report only)" >> "$GITHUB_STEP_SUMMARY"

      - name: upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage.out
          retention-days: 7

      - name: cross-build six platforms (goreleaser snapshot)
        run: go tool goreleaser build --snapshot --clean

      - name: govulncheck
        run: go tool govulncheck ./...

      - name: go mod tidy (no diff)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Phase 25/26: the reference pack's own rego tests
      # (packs/reference/infra/{terraform,kubernetes,helm}/checks/policy/*_test.rego)
      # against the real conftest binary just installed above.
      - name: conftest verify (reference pack rego)
        run: |
          conftest verify --policy packs/reference/infra/terraform/checks/policy
          conftest verify --policy packs/reference/infra/kubernetes/checks/policy
          conftest verify --policy packs/reference/infra/helm/checks/policy

      - name: build ai-flow
        run: go build -o /tmp/ai-flow-dogfood ./cmd/ai-flow

      - name: standards validate packs/reference
        run: /tmp/ai-flow-dogfood standards validate packs/reference

      # Dogfooding (phase 14): the freshly built binary runs README.md's
      # own "Use in CI" command against this repository, its embedded
      # reference pack and this repo's own .ai-flow/standards/ override
      # (see that directory's standards.json for why). No config init:
      # since phase 33 the directory form runs without a config.json,
      # exactly as an adopter's pipeline would.
      - name: standards check . (dogfood the reference pack)
        run: /tmp/ai-flow-dogfood standards check .

      # The step above passing proves little on its own — before phase
      # 33 it passed while running no infrastructure check at all, and
      # while go.lint crashed unnoticed. This one must *fail*: a
      # terraform repository with two reference-policy violations has to
      # come back exit 6 with exactly those two policy findings.
      - name: standards check on a violating terraform repository (findings expected)
        run: |
          repo="$(mktemp -d)/infra-repo"
          cp -r testdata/repos/terraform-e2e "$repo"
          mv "$repo/main.tf.fixture" "$repo/main.tf"
          out="$(mktemp)" # outside the repository: conftest would try to parse it
          cd "$repo"
          set +e
          /tmp/ai-flow-dogfood standards check . > "$out"
          code=$?
          set -e
          jq . "$out"
          test "$code" -eq 6
          jq -e '[.error.details[] | select(startswith("infra.terraform.policy: main.tf: "))] | length == 2' "$out"
