name: CodeQL

# Non-required (phase 48, HYG-5). CodeQL's cross-function taint tracking
# covers the class of the 2026-09-27 review's argument-injection finding
# (config input → exec argv), which gosec and govulncheck, being
# single-function or dependency-only, do not reach. Findings land in the
# repository's code-scanning tab; nothing here fails a PR on them.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

env:
  GOTOOLCHAIN: local

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: go build
        if: matrix.build-mode == 'manual'
        run: go build ./...

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: /language:${{ matrix.language }}
