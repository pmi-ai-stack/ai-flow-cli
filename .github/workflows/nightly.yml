name: Nightly

# Phase 30 ("Hardening and phase-2 intake") activates the scheduled job
# the CI gates table has named since phase 1: "`-tags integration` (real
# git), `-tags mutation` and `-tags ops` (real tools when on PATH, `kind`
# in CI), `gremlins` on internal/{handoff,mutation,standards,ops/risk,
# ops/exec,agenthost/guard} at threshold 80". Every tool version below
# was installed and run for real in this phase's own development
# session (`.ai/phase-30/implementation-log.md`) before being pinned
# here — none is a guess.

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC — off the hour, avoiding the scheduled-job stampede GitHub's own docs warn about
  workflow_dispatch: {}

env:
  GOTOOLCHAIN: local

# Least privilege: every job here only reads the repository. A job that
# ever needs more gets its own job-level grant, never a wider default.
permissions:
  contents: read

jobs:
  real-tool-suites:
    name: Real-tool suites (-tags integration/mutation/ops)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # Real tools this session verified end to end (kind's own cluster
      # lifecycle included — see internal/ops/harness/ops_integration_test.go's
      # own doc comment for why that one test alone can take ~1 minute).
      # kubectl/helm/kustomize/terraform ship as real binaries; kind,
      # gremlins, kuttl, checkov and mutmut are Go/pip installs pinned
      # to what this phase actually ran.
      - name: hashicorp/setup-terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: azure/setup-kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: azure/setup-helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install kustomize, kind, gremlins, kuttl
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@latest
          go install sigs.k8s.io/kind@v0.33.0
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          go install github.com/kudobuilder/kuttl/cmd/kubectl-kuttl@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install mutmut (real mutmut for the -tags mutation Python path, best-effort)
        run: pip install --user mutmut || true

      # -tags integration: real git, temporary repositories
      # (internal/gitops, internal/verify/visual's dev-server lifecycle,
      # internal/cli's ship-tail walkthrough).
      - name: go test -tags integration
        run: go test -tags integration -race -count=1 ./...

      # -tags mutation: real gremlins/mutmut/stryker/pitest, skipping
      # cleanly (not failing) whichever of npx-stryker/mvn-pitest this
      # runner does not also provision — the same documented posture
      # -tags ops already uses per addon.
      - name: go test -tags mutation
        run: go test -tags mutation -count=1 ./...

      # -tags ops: real terraform/kubectl/helm/kustomize/kind against
      # this runner's own Docker daemon (already present on
      # ubuntu-latest); kubeconform/ct/kuttl/chainsaw/act/actionlint/
      # jenkins-cli remain absent here and skip cleanly, the identical
      # disclosed gap phases 21/22/24/26/27 each already recorded by
      # hand for their own development environment.
      - name: go test -tags ops
        run: go test -tags ops -count=1 -timeout 20m ./...

      # -tags e2e (phase 33): `standards check <dir>`, the documented CI
      # use case, against the real scanners — kept off the required job
      # so a scanner's own rule-database update can never block an
      # unrelated PR. The required job already runs the conftest-only
      # README case on every PR.
      - name: Install check-runner tools for -tags e2e (conftest, gitleaks, checkov)
        run: |
          go install github.com/open-policy-agent/conftest@v0.70.1
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          pip install --user checkov==3.3.19

      - name: go test -tags e2e
        run: go test -tags e2e -count=1 ./internal/cli/

  gremlins-threshold:
    name: gremlins mutation-coverage threshold (80% efficacy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install gremlins
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # One package per invocation, not a single ./... run: gremlins
      # accepts exactly one positional path and, as internal/mutation/
      # gremlins/gremlins.go's own doc comment now explains at length,
      # does not use Go's "/..." package-pattern suffix at all — a
      # bug this phase found and fixed in the CLI's own gremlins runner
      # by hitting the identical failure mode here first.
      #
      # --workers 1 --timeout-coefficient 5 and -E excludes for the
      # two packages with a same-named test-double subpackage
      # (handofftest, exectest) are this phase's own tuning, verified
      # by hand to remove the flaky TIMED OUT noise internal/ops/exec's
      # own real-subprocess-timing tests otherwise produce under
      # mutation (see the implementation log for the two efficacy
      # numbers — 66.67% noisy vs. 100% tuned — from the same source).
      - name: gremlins unleash internal/handoff
        run: gremlins unleash internal/handoff --threshold-efficacy 80 --workers 1 --timeout-coefficient 5 -E 'handofftest/.*'

      - name: gremlins unleash internal/mutation
        run: gremlins unleash internal/mutation --threshold-efficacy 80 --workers 1 --timeout-coefficient 5

      - name: gremlins unleash internal/standards
        run: gremlins unleash internal/standards --threshold-efficacy 80 --workers 1 --timeout-coefficient 5 -E 'check/.*'

      - name: gremlins unleash internal/ops/risk
        run: gremlins unleash internal/ops/risk --threshold-efficacy 80 --workers 1 --timeout-coefficient 5

      - name: gremlins unleash internal/ops/exec
        run: gremlins unleash internal/ops/exec --threshold-efficacy 80 --workers 1 --timeout-coefficient 5 -E 'exectest/.*'

      - name: gremlins unleash internal/agenthost/guard
        run: gremlins unleash internal/agenthost/guard --threshold-efficacy 80 --workers 1 --timeout-coefficient 5

  windows-app-pipeline:
    name: Windows — app pipeline (fixture-only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # Phase 30's own Windows decision (`.ai/phase-30/plan.md` §Windows):
      # the app pipeline needs no POSIX shell — internal/ops/exec.Runner
      # calls os/exec.CommandContext(tool, args...) directly, never a
      # shell (`grep -n "osexec.CommandContext" internal/ops/exec/run.go`),
      # and every path in this module goes through path/filepath, so the
      # untagged suite (fixtures only, no real external tool) is exactly
      # what "the app pipeline verified" on Windows means. -tags
      # integration/mutation/ops are deliberately excluded here: they
      # need real git/terraform/kubectl/gremlins provisioning this job
      # does not attempt to duplicate for a second OS, and the spec's
      # own P8 goal only asks that "the app pipeline" — not OPS tooling
      # — be verified on Windows (OPS tooling support is separately
      # "scoped," not verified, per the same decision).
      - name: go test ./...
        run: go test -race -count=1 ./...
