name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # Keyless cosign signing of checksums.txt (.goreleaser.yaml's signs:)
  # mints its certificate from this workflow's GitHub OIDC token.
  id-token: write

env:
  GOTOOLCHAIN: local

jobs:
  goreleaser:
    name: goreleaser release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # cosign v2 specifically: .goreleaser.yaml's signs: args are v2's
      # --output-certificate/--output-signature, which v3's bundle-first
      # defaults change.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - uses: anchore/sbom-action/download-syft@v0

      - name: goreleaser release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go tool goreleaser release --clean
