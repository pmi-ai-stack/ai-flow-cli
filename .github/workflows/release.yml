name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  # Keyless cosign signing of checksums.txt and of the image manifests
  # (.goreleaser.yaml's signs:/docker_signs:) mints its certificate from
  # this workflow's GitHub OIDC token.
  id-token: write
  # Pushes ghcr.io/pmi-ai-stack/ai-flow-cli (.goreleaser.yaml's dockers_v2:).
  packages: write

env:
  GOTOOLCHAIN: local

jobs:
  goreleaser:
    name: goreleaser release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # cosign v2 specifically: .goreleaser.yaml's signs: args are v2's
      # --output-certificate/--output-signature, which v3's bundle-first
      # defaults change.
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.4.1

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      # dockers_v2 builds linux/amd64 and linux/arm64 in one buildx call.
      # The Dockerfile only COPYs a static binary and never RUNs anything,
      # so no QEMU emulation is needed for the arm64 image.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # HOMEBREW_TAP_GITHUB_TOKEN is optional: without it the cask is
      # generated but not pushed (.goreleaser.yaml's skip_upload).
      - name: goreleaser release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: go tool goreleaser release --clean
