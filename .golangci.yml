version: "2"
run:
  timeout: 5m
  build-tags: [integration, mutation, ops]
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint
    - bodyclose
    - nolintlint
    - gochecknoinits
    - gochecknoglobals
    - forbidigo
    - gosec
    - misspell
    - thelper
    - testifylint
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
    nolintlint:
      require-explanation: true
      require-specific: true
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print(|f|ln)$'
          msg: "stdout is the envelope; use cmd.OutOrStdout()/ErrOrStderr() or the logger"
        - pattern: '^(print|println)$'
        - pattern: '^os\.Exit$'
          msg: "only main exits"
        - pattern: '^log\.(Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$'
        - pattern: '^exec\.Command(Context)?$'
          msg: "every subprocess goes through internal/ops/exec"
        - pattern: '^os\.Setenv$'
          msg: "build cmd.Env explicitly; t.Setenv in tests"
        - pattern: '^time\.Sleep$'
          msg: "use ctx deadlines / tickers"
        - pattern: '^time\.Now$'
          msg: "results files carry no wall-clock data; inject a clock or write to events.jsonl only"
    gosec:
      excludes: [G204]
  exclusions:
    generated: lax
    rules:
      - path: ^cmd/ai-flow/main\.go$
        linters: [forbidigo, gochecknoglobals] # version/commit/date are -X link-time injection targets
      - path: ^internal/ops/exec/
        text: 'exec\.Command'
      - path: ^internal/ops/exec/allowlist\.go$
        linters: [gochecknoglobals]
      - path: ^internal/ops/exec/denied\.go$
        linters: [gochecknoglobals] # CommandHints is a lookup table, not mutable state
      - path: ^internal/envelope/exitcode\.go$
        linters: [gochecknoglobals] # codeExitCode is a lookup table, not mutable state
      - path: ^schema/embed\.go$
        linters: [gochecknoglobals] # FS is the embedded schema content, not mutable state
      - path: ^internal/schema/registry\.go$
        linters: [gochecknoglobals] # artifacts is a lookup table, not mutable state
      - path: ^internal/schema/compile\.go$
        linters: [gochecknoglobals] # compiled is a compiled-schema cache, not mutable state
      - path: ^internal/redact/redact\.go$
        linters: [gochecknoglobals] # secretEnvVars is a lookup table, not mutable state
      - path: ^internal/config/template\.go$
        linters: [gochecknoglobals] # templateBytes is the embedded template content, not mutable state
      - path: ^internal/ops/exec/table\.go$
        linters: [gochecknoglobals] # Table is the allowlist itself — the one package-level slice every phase from 5 on is expected to append rows to
      - path: ^internal/handoff/events\.go$
        text: 'time\.Now'
      - path: ^internal/handoff/clock\.go$
        linters: [gochecknoglobals] # Now is the injectable clock by design — tests reassign it (handofftest.FixedClock)
      - path: ^internal/handoff/clock\.go$
        text: 'time\.Now'
      - path: ^internal/handoff/key\.go$
        linters: [gochecknoglobals] # ReservedNames is a lookup table, not mutable state
      - path: ^internal/standards/validate\.go$
        linters: [gochecknoglobals] # renderingValidatorTools is a lookup table, not mutable state
      - path: ^internal/standards/clock\.go$
        linters: [gochecknoglobals, forbidigo] # defaultClock is the injectable clock by design, mirroring internal/handoff/clock.go's own Now
      - path: ^internal/standards/check/runner\.go$
        linters: [gochecknoglobals] # runners is the kind -> CheckRunner dispatch table, not mutable state
      - path: ^internal/standards/check/pr\.go$
        linters: [gochecknoglobals] # requiredPRHeadings is a lookup table, not mutable state
      - path: ^internal/handoff/stage\.go$
        linters: [gochecknoglobals] # stages is the one declared pipeline order every other table derives from, not mutable state
      - path: ^internal/handoff/stagetable\.go$
        linters: [gochecknoglobals] # stageTable is a lookup table, not mutable state
      - path: ^internal/handoff/catalog\.go$
        linters: [gochecknoglobals] # catalog is a lookup table, extended (not mutated) by later phases
      - path: ^internal/handoff/shouldrun\.go$
        linters: [gochecknoglobals] # skipRules is a lookup table, not mutable state
      - path: ^internal/handoff/predicates\.go$
        linters: [gochecknoglobals] # primaryArtifacts/schemaArtifactNames are lookup tables, not mutable state
      - path: ^internal/cli/ticket\.go$
        linters: [gochecknoglobals] # imageExtensions is a lookup table, not mutable state
      - path: ^internal/cli/git\.go$
        linters: [gochecknoglobals] # newExecer is the injectable Execer constructor by design — tests reassign it, mirroring handoff/clock.go's Now
      - path: ^internal/cli/ops\.go$
        linters: [gochecknoglobals] # newOpsExecer is the injectable Execer constructor for buildOpsRegistry's own addons, mirroring git.go's newExecer
      - path: ^internal/ops/addons/terraform/kindclass\.go$
        linters: [gochecknoglobals] # kindPrefixes is a lookup table, not mutable state
      - path: ^internal/ops/addons/terraform/planjson\.go$
        linters: [gochecknoglobals] # actionKinds is a lookup table, not mutable state
      - path: ^internal/ops/addons/terraform/rollback\.go$
        linters: [gochecknoglobals] # nonRevertibleClasses is a lookup table, not mutable state
      - path: ^internal/cli/pr\.go$
        linters: [gochecknoglobals] # newGitHubTransport is the injectable http.RoundTripper source by design — tests reassign it, mirroring handoff/clock.go's Now
      - path: ^internal/cli/visual\.go$
        linters: [gochecknoglobals] # newUnlistedRunner is the injectable exec.UnlistedRunner constructor by design — tests reassign it, mirroring git.go's newExecer
      - path: ^internal/detect/frontend\.go$
        linters: [gochecknoglobals] # frontendExtensions/frontendPathSegments are lookup tables, not mutable state
      - path: ^internal/detect/appfiles\.go$
        linters: [gochecknoglobals] # documentationExtensions/documentationBasenamePrefixes are lookup tables, not mutable state
      - path: ^internal/verify/visual/screens\.go$
        linters: [gochecknoglobals] # screenPathSegments is a lookup table, not mutable state
      - path: ^internal/cli/mutation\.go$
        linters: [gochecknoglobals] # mutationTools is a lookup table, not mutable state
      - path: ^internal/cli/doctor\.go$
        linters: [gochecknoglobals] # testRunnerBinaries/mutationToolBinaries/addonToolBinaries are lookup tables, not mutable state; whichOverride is the injectable exec.Which by design, mirroring git.go's newExecer
      - path: ^internal/ops/kindclass\.go$
        linters: [gochecknoglobals] # kindClasses is a lookup table, not mutable state
      - path: ^internal/cli/checks\.go$
        linters: [gochecknoglobals] # ticketOnlyKinds is a lookup table, not mutable state
      - path: ^internal/render/data\.go$
        linters: [gochecknoglobals] # severityOrder is a lookup table, not mutable state
      - path: ^internal/agenthost/guard/rows\.go$
        linters: [gochecknoglobals] # proseArtifacts/row6Denied/row7InfraTools/execAllowlist are lookup tables (or built once from one), not mutable state
      - path: ^internal/skills/lint/rules\.go$
        linters: [gochecknoglobals] # entryPointNames is a lookup table, not mutable state
      - path: ^internal/skills/lint/frontmatter\.go$
        linters: [gochecknoglobals] # allowedFrontmatterKeys is a lookup table, not mutable state
      - path: ^internal/skills/lint/commands\.go$
        linters: [gochecknoglobals] # catalogByName/stageNameSet are sync.OnceValue-memoized lookup tables, not mutable state
      - path: ^internal/skills/lint/tokens\.go$
        linters: [gochecknoglobals] # knownHandoffNames is a sync.OnceValue-memoized lookup table, not mutable state
      - path: ^internal/skills/lint/evals\.go$
        linters: [gochecknoglobals] # requiredEvalScenarios is a lookup table, not mutable state
      - path: ^internal/skills/lint/addon\.go$
        linters: [gochecknoglobals] # addonSections is a lookup table, not mutable state
      - path: ^internal/skills/evals/evals\.go$
        linters: [gochecknoglobals] # requiredKinds is a lookup table, not mutable state
      - path: ^internal/skills/evals/host\.go$
        linters: [gochecknoglobals] # Runners is a lookup table (the host-name -> HostRunner registry), not mutable state
      - path: ^internal/skills/evals/order\.go$
        linters: [gochecknoglobals] # commandNames is a sync.OnceValue-memoized lookup table, not mutable state
      - path: ^internal/ops/addons/kubectl/detect\.go$
        linters: [gochecknoglobals] # chartOrKustomizeMarker is a lookup table, not mutable state
      - path: ^internal/ops/addons/kubectl/harness\.go$
        linters: [gochecknoglobals] # e2eHarnessFiles is a lookup table, not mutable state
      - path: ^internal/ops/addons/kubectl/kindclass\.go$
        linters: [gochecknoglobals] # kindClasses is a lookup table, not mutable state
      - path: ^internal/ops/addons/kubectl/normalize\.go$
        linters: [gochecknoglobals] # volatileMetadataKeys is a lookup table, not mutable state
      - path: ^internal/ops/addons/kubectl/rollback\.go$
        linters: [gochecknoglobals] # nonRevertibleClasses is a lookup table, not mutable state
      - path: _test\.go$
        linters: [errcheck, bodyclose, gochecknoglobals, forbidigo, gosec]
formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/pmi-ai-stack/ai-flow-cli]
