version: 2

project_name: ai-flow

before:
  hooks:
    - go mod tidy

builds:
  - id: ai-flow
    main: ./cmd/ai-flow
    binary: ai-flow
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: ai-flow
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# Keyless cosign over checksums.txt: one signature transitively covers
# every archive, which install.sh already checksums. release.yml grants
# id-token: write for the OIDC identity and installs a cosign v2 release
# (these are v2's flags). install.sh verifies against exactly that
# workflow identity at the tag being installed.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

# One SPDX SBOM per archive, generated by syft (installed by release.yml).
sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^test:"
      - "^chore:"

release:
  github:
    owner: pmi-ai-stack
    name: ai-flow-cli
