title = "ai-flow reference gitleaks config"
# The one pack-wide "secrets" check config (checks/, not per-language —
# a credential leak doesn't care which language surrounds it). Runs
# against the diff only; secrets checks cannot be waived — the pack
# format's own loader rule, enforced by phase 13's resolver, not by
# this config file.

[extend]
useDefault = true

# Markdown is scanned like everything else: a key pasted into a README
# or a design note is as leaked as one in code, and this check cannot be
# waived. A repository that needs an exemption overrides org.secrets with
# its own config (see this repo's .ai-flow/standards/), where the
# exemption is visible and reviewed.
[allowlist]
description = "generated test fixtures"
paths = [
  '''testdata/''',
]
